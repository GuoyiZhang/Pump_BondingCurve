<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI Agent — 市场机会与商业布局</title>
<style>
/* ===========================================
   v6 设计系统 — 干净 / 高级 / 科技
   原则：克制配色 · 充足留白 · 精致细节 · 不浮夸
   =========================================== */
:root{
  /* 背景：纯深色，不加花哨 */
  --bg:#0a0e1f;
  --bg-soft:#10152b;
  /* 文字：高对比但不刺眼 */
  --fg:#f5f7fc;
  --fg-soft:#c8d0e0;
  --muted:#7b86a3;
  /* 强调：主蓝 + 次青，只用两色 */
  --accent:#6b8cff;
  --accent2:#3dd9eb;
  --accent-soft:rgba(107,140,255,0.12);
  /* 状态色：保留但少用 */
  --warn:#fbbf24;
  --ok:#34d399;
  --danger:#f87171;
  /* 卡片：浅半透明 + 细边框，不用 backdrop-filter（文字最清晰） */
  --card-bg:rgba(255,255,255,0.035);
  --card-bg-hover:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(255,255,255,0.16);
  /* 圆角：统一两档 */
  --r-md:14px;
  --r-sm:10px;
  /* 阴影：极克制 */
  --shadow-sm:0 2px 8px rgba(0,0,0,0.2);
  --shadow-md:0 8px 24px rgba(0,0,0,0.25);
  /* 动效曲线：统一一条 */
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--fg);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.01em;
}

/* === 背景装饰：多个柔和光球，随鼠标视差移动（Kraft 风格）=== */
.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.ambient .orb{
  position:absolute;border-radius:50%;
  filter:blur(50px);
  mix-blend-mode:screen;
  will-change:transform;
  --mx:0px; --my:0px;
}
.ambient .orb1{
  width:680px;height:680px;
  background:radial-gradient(circle,rgba(107,140,255,0.55) 0%,rgba(107,140,255,0.2) 40%,transparent 70%);
  top:-180px;left:-160px;
  animation:drift1 28s ease-in-out infinite;
}
.ambient .orb2{
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(61,217,235,0.45) 0%,rgba(61,217,235,0.15) 40%,transparent 70%);
  bottom:-200px;right:-180px;
  animation:drift2 34s ease-in-out infinite;
}
.ambient .orb3{
  width:520px;height:520px;
  background:radial-gradient(circle,rgba(167,139,250,0.4) 0%,rgba(167,139,250,0.12) 40%,transparent 70%);
  top:40%;left:55%;
  animation:drift3 32s ease-in-out infinite;
}
.ambient .orb4{
  width:440px;height:440px;
  background:radial-gradient(circle,rgba(244,114,182,0.35) 0%,rgba(244,114,182,0.1) 40%,transparent 70%);
  bottom:10%;left:8%;
  animation:drift1 40s ease-in-out infinite reverse;
}
/* drift 动画叠加鼠标位移（通过 CSS 变量 --mx --my）*/
@keyframes drift1{
  0%,100%{transform:translate(var(--mx),var(--my)) translate(0,0)}
  50%{transform:translate(var(--mx),var(--my)) translate(30px,20px)}
}
@keyframes drift2{
  0%,100%{transform:translate(var(--mx),var(--my)) translate(0,0)}
  50%{transform:translate(var(--mx),var(--my)) translate(-25px,-15px)}
}
@keyframes drift3{
  0%,100%{transform:translate(var(--mx),var(--my)) translate(0,0)}
  50%{transform:translate(var(--mx),var(--my)) translate(20px,-25px)}
}

/* === Deck === */
.deck{position:relative;width:100vw;height:100vh;overflow:hidden;z-index:1}

/* === Slide 基础：充足留白，文字绝对清晰 === */
.slide{
  position:absolute;inset:0;
  padding:56px 72px 64px;
  display:none;flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow-y:auto;overflow-x:hidden;
}
/* active 时居中：内容短则垂直居中，内容长则从顶部开始（justify-content 自然失效）*/
.slide.active{display:flex;animation:pageIn .35s var(--ease)}
.slide::-webkit-scrollbar{width:6px}
.slide::-webkit-scrollbar-track{background:transparent}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}
.slide::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* slide-inner 撑满父容器宽度，内容自动水平居中 + 限制最大宽度 */
.slide-inner{
  width:100%;
  max-width:1180px;
  margin:auto;
  display:flex;flex-direction:column;
  justify-content:center;
}
@keyframes pageIn{
  from{opacity:0}
  to{opacity:1}
}

/* === 元素错位渐入：克制 0.04s 间隔 === */
.slide.active .card,
.slide.active .layer,
.slide.active .step,
.slide.active .box,
.slide.active .vs>div,
.slide.active .warn-box,
.slide.active .quote,
.slide.active pre,
.slide.active table,
.slide.active .item{
  animation:rise .5s var(--ease) both;
}
.slide.active .card:nth-child(2),
.slide.active .item:nth-child(2){animation-delay:0.04s}
.slide.active .card:nth-child(3),
.slide.active .item:nth-child(3){animation-delay:0.08s}
.slide.active .card:nth-child(4),
.slide.active .item:nth-child(4){animation-delay:0.12s}
.slide.active .card:nth-child(5){animation-delay:0.16s}
.slide.active .card:nth-child(6){animation-delay:0.20s}
.slide.active .layer:nth-child(2){animation-delay:0.04s}
.slide.active .layer:nth-child(3){animation-delay:0.08s}
.slide.active .layer:nth-child(4){animation-delay:0.12s}
.slide.active .step:nth-child(3){animation-delay:0.06s}
.slide.active .step:nth-child(4){animation-delay:0.12s}
.slide.active .step:nth-child(5){animation-delay:0.18s}
.slide.active .step:nth-child(6){animation-delay:0.24s}
.slide.active .step:nth-child(7){animation-delay:0.30s}
@keyframes rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

/* === 标题：字重分层，不发光 === */
.slide h1{
  font-size:46px;line-height:1.15;font-weight:700;letter-spacing:-0.025em;
  margin-bottom:16px;
}
.slide h2{
  font-size:32px;line-height:1.2;font-weight:600;letter-spacing:-0.02em;
  color:var(--fg);
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:1px solid var(--border);
}
.slide h3{
  font-size:18px;font-weight:600;letter-spacing:-0.01em;
  color:var(--accent);
  margin:16px 0 10px;
}
.slide p{
  font-size:17px;line-height:1.7;color:var(--fg-soft);
  margin-bottom:10px;
}
.slide ul,.slide ol{margin:8px 0 16px 4px}
.slide li{
  font-size:16px;line-height:1.8;color:var(--fg-soft);
  margin-left:22px;
}
.slide li::marker{color:var(--accent)}
.lead{font-size:19px;color:var(--fg-soft);line-height:1.65}
.small{font-size:13px;color:var(--muted)}
.kicker{
  font-size:12px;color:var(--accent);letter-spacing:0.18em;
  text-transform:uppercase;font-weight:600;
  margin-bottom:14px;
}

/* === 网格 === */
.grid{display:grid;gap:14px;margin-top:12px;align-content:start}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

/* === 卡片：浅半透明 + 细边框，hover 仅抬升 2px === */
.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:18px 20px;
  display:flex;flex-direction:column;
  transition:transform .4s var(--ease),background .4s,border-color .4s;
}
.card>*:last-child{margin-bottom:0}
.card h3{margin-top:0}
.card h3{margin-top:0}
.card p{font-size:14px;color:var(--muted);line-height:1.65}
.card:hover{
  transform:translateY(-2px);
  background:var(--card-bg-hover);
  border-color:var(--border-hover);
}

/* === 流程图 === */
.flow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:16px 0}
.flow .step{
  flex:1;min-width:120px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:14px 16px;
  text-align:center;
  transition:all .3s var(--ease);
}
.flow .step b{display:block;color:var(--accent);font-size:14px;font-weight:600;margin-bottom:4px}
.flow .step span{font-size:12px;color:var(--muted)}
.flow .step:hover{border-color:var(--border-hover);background:var(--card-bg-hover)}
.flow .arrow{display:flex;align-items:center;color:var(--accent);opacity:0.5;font-size:18px}

/* === 层级架构 === */
.arch{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.arch .layer{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:14px 18px;
  display:flex;align-items:center;gap:16px;
  transition:all .3s var(--ease);
}
.arch .layer b{color:var(--accent);min-width:120px;font-size:14px;font-weight:600}
.arch .layer span{color:var(--fg-soft);font-size:14px}
.arch .layer:hover{border-color:var(--border-hover);background:var(--card-bg-hover)}

/* === 对比框 === */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:14px 0;
  border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.vs>div{padding:18px 22px}
.vs .l{background:rgba(248,113,113,0.05);border-right:1px solid var(--border)}
.vs .r{background:rgba(52,211,153,0.05)}
.vs h4{font-size:14px;font-weight:600;margin-bottom:8px;letter-spacing:-0.01em}
.vs .l h4{color:var(--danger)}
.vs .r h4{color:var(--ok)}
.vs p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}

/* === 引用 / 警告 === */
.quote{
  border-left:2px solid var(--accent);
  padding:12px 20px;
  background:var(--accent-soft);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin:14px 0;
}
.quote p{font-size:15px;color:var(--fg-soft);font-style:normal;line-height:1.7;margin:0}

.warn-box{
  border:1px solid rgba(251,191,36,0.25);
  background:rgba(251,191,36,0.06);
  border-radius:var(--r-sm);
  padding:14px 20px;
  margin:12px 0;
}
.warn-box b{color:var(--warn);font-weight:600}
.warn-box p,.warn-box{font-size:14px;color:var(--fg-soft);line-height:1.7}

/* === 表格：紧凑专业 === */
table{
  width:100%;border-collapse:separate;border-spacing:0;
  margin:12px 0;font-size:14px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  overflow:hidden;
}
th,td{padding:12px 16px;text-align:left;vertical-align:top}
th{
  color:var(--accent);font-weight:600;font-size:13px;
  letter-spacing:0.02em;
  background:rgba(107,140,255,0.08);
  border-bottom:1px solid var(--border);
}
td{color:var(--fg-soft);border-bottom:1px solid rgba(255,255,255,0.05);line-height:1.6}
tr:last-child td{border-bottom:none}

/* === 代码块：纯净深色，无光标无闪烁 === */
pre{
  background:#060a18;
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:16px 18px;
  overflow-x:auto;max-width:100%;
  font-size:12px;line-height:1.65;
  margin:12px 0;
}
code{font-family:"SF Mono",Menlo,Monaco,Consolas,monospace}
pre code{color:var(--fg-soft);display:block}
.ic{color:var(--accent2)}
.ik{color:var(--warn)}
.is{color:#f9a8d4}
.in{color:#c4b5fd}

/* === 双栏 === */
.cols{display:flex;gap:24px;margin:14px 0;align-items:stretch}
.cols>*{flex:1;min-width:0;overflow:hidden}
.cols>*>*:last-child{margin-bottom:0}
.item{display:flex;flex-direction:column;justify-content:center}

/* === 标签 / 徽章 === */
.tag{
  display:inline-block;
  padding:4px 11px;
  border-radius:999px;
  font-size:12px;font-weight:500;
  background:var(--accent-soft);
  color:var(--accent);
  border:1px solid rgba(107,140,255,0.2);
  margin-right:6px;
  transition:all .3s var(--ease);
}
.tag:hover{background:rgba(107,140,255,0.18)}
.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:6px;
  font-size:12px;font-weight:600;
  background:rgba(107,140,255,0.15);
  color:var(--accent);
  border:1px solid rgba(107,140,255,0.25);
}
.badge.green{background:rgba(52,211,153,0.12);color:var(--ok);border-color:rgba(52,211,153,0.25)}
.badge.amber{background:rgba(251,191,36,0.12);color:var(--warn);border-color:rgba(251,191,36,0.25)}

/* === 大数字 === */
.big-stat{
  display:block;
  font-size:48px;font-weight:700;letter-spacing:-0.03em;
  color:var(--fg);
  margin-bottom:4px;
}
.stat-label{font-size:13px;color:var(--muted);line-height:1.5}

/* === 键帽 === */
.kbd{
  display:inline-block;
  padding:2px 7px;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  border-radius:5px;
  font-size:12px;
  font-family:"SF Mono",Menlo,monospace;
  color:var(--fg-soft);
}

/* === 封面 === */
.cover{justify-content:center}
/* 封面：左右分栏布局 */
.cover{position:relative}
.cover .slide-inner{
  min-height:calc(100vh - 112px);
  justify-content:center;
  padding:60px 0;
}
.cover-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:60px;
  align-items:center;
  width:100%;
  max-width:1280px;
}
.cover-left{display:flex;flex-direction:column;gap:18px}
.cover-right{
  display:flex;align-items:center;justify-content:center;
  position:relative;
  min-height:420px;
}

/* === CSS 3D 机器人 === */
.robot-3d{
  position:relative;
  width:360px;height:360px;
  perspective:1000px;
}
.robot-head{
  position:absolute;
  top:50%;left:50%;
  width:240px;height:240px;
  transform:translate(-50%,-50%) rotateX(-15deg) rotateY(0deg);
  transform-style:preserve-3d;
  animation:robotFloat 5s ease-in-out infinite;
}
@keyframes robotFloat{
  0%,100%{transform:translate(-50%,-50%) rotateX(-15deg) rotateY(-8deg) translateY(0)}
  50%{transform:translate(-50%,-50%) rotateX(-15deg) rotateY(8deg) translateY(-12px)}
}
.robot-face{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#1a2240 0%,#0e1530 100%);
  border:2px solid rgba(107,140,255,0.4);
  border-radius:32px;
  box-shadow:
    0 30px 60px rgba(0,0,0,0.4),
    inset 0 2px 0 rgba(255,255,255,0.15),
    inset 0 -2px 0 rgba(0,0,0,0.3);
  overflow:hidden;
}
.robot-face::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(107,140,255,0.08) 0%,transparent 50%,rgba(61,217,235,0.06) 100%);
  pointer-events:none;
}
.robot-eye{
  position:absolute;top:75px;
  width:48px;height:48px;
  background:radial-gradient(circle,#3dd9eb 0%,#6b8cff 60%,transparent 100%);
  border-radius:50%;
  box-shadow:0 0 30px rgba(61,217,235,0.7),0 0 60px rgba(107,140,255,0.4),inset 0 0 12px rgba(255,255,255,0.6);
  animation:eyeBlink 4s ease-in-out infinite;
}
.robot-eye.left{left:48px}
.robot-eye.right{right:48px}
@keyframes eyeBlink{
  0%,90%,100%{transform:scaleY(1)}
  93%,97%{transform:scaleY(0.1)}
}
.robot-mouth{
  position:absolute;bottom:60px;left:50%;
  width:80px;height:6px;
  background:linear-gradient(90deg,transparent,#3dd9eb 20%,#6b8cff 80%,transparent);
  border-radius:3px;
  transform:translateX(-50%);
  box-shadow:0 0 12px rgba(61,217,235,0.5);
}
.robot-line.top{
  position:absolute;top:35px;left:30px;right:30px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(107,140,255,0.4),transparent);
}
.robot-line.bottom{
  position:absolute;bottom:35px;left:30px;right:30px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(107,140,255,0.4),transparent);
}
.robot-ear{
  position:absolute;top:50%;width:24px;height:60px;
  background:linear-gradient(180deg,#1a2240 0%,#0e1530 100%);
  border:2px solid rgba(107,140,255,0.4);
  border-radius:12px;
  transform:translateY(-50%);
  box-shadow:inset 0 0 8px rgba(0,0,0,0.3);
}
.robot-ear.left{left:-20px}
.robot-ear.right{right:-20px}
.robot-antenna{
  position:absolute;top:-32px;left:50%;
  width:4px;height:32px;
  background:linear-gradient(180deg,#6b8cff,rgba(107,140,255,0.3));
  transform:translateX(-50%);
}
.robot-antenna::after{
  content:"";position:absolute;top:-8px;left:50%;
  width:14px;height:14px;
  background:radial-gradient(circle,#3dd9eb,transparent 70%);
  border-radius:50%;
  transform:translateX(-50%);
  box-shadow:0 0 20px rgba(61,217,235,0.8);
  animation:antennaPulse 2s ease-in-out infinite;
}
@keyframes antennaPulse{
  0%,100%{opacity:0.7;transform:translateX(-50%) scale(1)}
  50%{opacity:1;transform:translateX(-50%) scale(1.3)}
}
.robot-shadow{
  position:absolute;bottom:30px;left:50%;
  width:180px;height:20px;
  background:radial-gradient(ellipse,rgba(107,140,255,0.3) 0%,transparent 70%);
  transform:translateX(-50%);
  filter:blur(8px);
  animation:shadowPulse 5s ease-in-out infinite;
}
@keyframes shadowPulse{
  0%,100%{transform:translateX(-50%) scale(1);opacity:0.6}
  50%{transform:translateX(-50%) scale(0.85);opacity:0.4}
}

/* 响应式 */
@media (max-width:1100px){
  .cover-grid{grid-template-columns:1fr;gap:30px}
  .cover-right{min-height:300px}
  .robot-3d{width:280px;height:280px}
  .robot-head{width:200px;height:200px}
  .robot-eye{width:40px;height:40px;top:60px}
  .robot-eye.left{left:38px}
  .robot-eye.right{right:38px}
}
.cover h1{
  font-size:64px;font-weight:700;letter-spacing:-0.035em;line-height:1.1;
  background:linear-gradient(135deg,#ffffff 0%,#a8b5e8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:20px;
  filter:drop-shadow(0 0 30px rgba(107,140,255,0.3));
}
.cover .sub{font-size:22px;color:var(--muted);font-weight:400;margin-bottom:32px}
.cover .meta{font-size:14px;color:var(--muted);line-height:1.8}

/* === 全局浮动小机器人（右下角，所有页面都显示，封面隐藏）=== */
.mini-robot{
  position:fixed;
  left:24px;
  bottom:18px;
  width:48px;height:48px;
  z-index:49;
  perspective:300px;
  cursor:pointer;
  filter:drop-shadow(0 4px 16px rgba(61,217,235,0.4));
  transition:transform .3s ease, filter .3s ease, opacity .4s ease;
}
.mini-robot:hover{
  transform:scale(1.25) translateY(-4px);
  filter:drop-shadow(0 8px 24px rgba(61,217,235,0.6));
}
.mini-head{
  width:48px;height:48px;
  transform-style:preserve-3d;
  animation:miniFloat 4s ease-in-out infinite;
}
@keyframes miniFloat{
  0%,100%{transform:rotateX(-10deg) rotateY(-6deg) translateY(0)}
  50%{transform:rotateX(-10deg) rotateY(6deg) translateY(-4px)}
}
.mini-face{
  width:100%;height:100%;
  background:linear-gradient(135deg,#1a2240,#0e1530);
  border:1.5px solid rgba(107,140,255,0.5);
  border-radius:13px;
  position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.12);
}
.mini-face::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(107,140,255,0.07),transparent);
}
.mini-eye{
  position:absolute;top:15px;
  width:9px;height:9px;
  background:radial-gradient(circle,#3dd9eb,#6b8cff 60%,transparent);
  border-radius:50%;
  box-shadow:0 0 10px rgba(61,217,235,0.8),0 0 18px rgba(107,140,255,0.4);
  animation:miniEyeBlink 4s ease-in-out infinite;
}
.mini-eye.left{left:10px}
.mini-eye.right{right:10px}
@keyframes miniEyeBlink{
  0%,90%,100%{transform:scaleY(1)}
  93%,97%{transform:scaleY(0.1)}
}
.mini-mouth{
  position:absolute;bottom:11px;left:50%;
  width:16px;height:2.5px;
  background:linear-gradient(90deg,transparent,#3dd9eb,#6b8cff,transparent);
  border-radius:2px;
  transform:translateX(-50%);
  box-shadow:0 0 6px rgba(61,217,235,0.5);
}
.mini-ear{
  position:absolute;top:50%;
  width:5px;height:13px;
  background:linear-gradient(180deg,#1a2240,#0e1530);
  border:1px solid rgba(107,140,255,0.4);
  border-radius:3px;
  transform:translateY(-50%);
}
.mini-ear.left{left:-4px}
.mini-ear.right{right:-4px}
.mini-antenna{
  position:absolute;top:-9px;left:50%;
  width:2px;height:9px;
  background:linear-gradient(180deg,#6b8cff,rgba(107,140,255,0.2));
  transform:translateX(-50%);
}
.mini-antenna::after{
  content:"";position:absolute;top:-5px;left:50%;
  width:6px;height:6px;
  background:radial-gradient(circle,#3dd9eb,transparent 70%);
  border-radius:50%;
  transform:translateX(-50%);
  box-shadow:0 0 10px rgba(61,217,235,0.9);
  animation:antennaPulse 2s ease-in-out infinite;
}

<span class="in">Observation</span>: 约 2 BNB
<span class="ik">Thought</span>: 再查 LP 仓位
<span class="ic">Action</span>: call_contract(...)
<span class="in">Observation</span>: { tick:-100, liq:1e18 }

    <div class="card" style="padding:18px 20px"><h3 style="margin:0 0 8px;font-size:15px">① 单 Agent 单轮</h3><p style="font-size:13px;line-height:1.7;margin:0 0 8px">一个 LLM + 几个工具<br/>一轮完成</p><p style="font-size:12px;color:var(--accent);margin:0">例：翻译、SQL 生成</p></div>
    <div class="card" style="padding:18px 20px"><h3 style="margin:0 0 8px;font-size:15px">② 单 Agent 多步</h3><p style="font-size:13px;line-height:1.7;margin:0 0 8px">自主规划多步<br/>维护 TODO 列表<br/>当前主流形态</p><p style="font-size:12px;color:var(--accent);margin:0">例：Cursor / 调研 Agent</p></div>
    <div class="card" style="padding:18px 20px"><h3 style="margin:0 0 8px;font-size:15px">③ 多 Agent 协作</h3><p style="font-size:13px;line-height:1.7;margin:0 0 8px">多角色分工<br/>Orchestrator 编排<br/>复杂任务专用</p><p style="font-size:12px;color:var(--accent);margin:0">例：MetaGPT、CrewAI、Devin</p></div>
  </div>
  <table style="margin-top:18px">
    <tr><th>框架</th><th>特点</th><th>适合场景</th><th>成本</th></tr>
    <tr><td>LangGraph</td><td>图结构编排，状态机清晰，可中断/回溯</td><td>需要精确控制流程的生产系统</td><td>中</td></tr>
    <tr><td>OpenAI Agents SDK</td><td>官方出品，Handoff 机制简单</td><td>快速原型、ChatGPT 生态</td><td>低</td></tr>
    <tr><td>CrewAI</td><td>角色化 Agent，"团队"概念直观</td><td>多角色协作类任务</td><td>低</td></tr>
    <tr><td>AutoGen</td><td>微软出品，对话式多 Agent</td><td>研究、讨论型任务</td><td>中</td></tr>
    <tr><td>裸写 (LLM + 工具)</td><td>直接用 SDK + while 循环</td><td>定制化、最小依赖</td><td>看团队</td></tr>
  </table>
  <div class="quote" style="margin-top:14px"><p>选型建议：80% 场景用"裸写 + MCP 工具"即可。需要复杂流程再上 LangGraph，需要多人协作再上 CrewAI。框架是手段，不是目的。</p></div>
`},

{type:'content', html:`
  <h2>Agent 的"手"与"脑"—— 工具 / 记忆 / MCP</h2>
  <div class="grid g2" style="margin-top:14px;gap:12px">
    <div class="card" style="padding:14px 16px">
      <h3 style="margin:0 0 6px;font-size:14px">🔧 MCP (Model Context Protocol)</h3>
      <p style="font-size:12px;line-height:1.7;margin:0">Anthropic 2024 推出的开放协议，类比"USB-C for AI"<br/>Server 暴露工具，Client (任意模型) 即插即用<br/>已有数百个 MCP Server：GitHub / Jira / Slack / Postgres<br/>解决"每个项目都重写工具集成"的痛点</p>
    </div>
    <div class="card" style="padding:14px 16px">
      <h3 style="margin:0 0 6px;font-size:14px">💾 规划与记忆</h3>
      <p style="font-size:12px;line-height:1.7;margin:0"><b>规划</b>：Plan-and-Execute / ReAct / Tree of Thoughts / Reflection<br/><b>短期记忆</b>：当前会话上下文 / 工作区文件<br/><b>长期记忆</b>：向量库召回历史经验<br/><b>组织级</b>：组织知识库 / 项目约定 / 文档中心</p>
    </div>
  </div>
  <pre style="margin-top:14px;font-size:11px"><code><span class="ik">// MCP Server 暴露一个工具</span>
server.tool(<span class="is">"get_token_balance"</span>, {
  chain: z.enum([<span class="is">"bsc"</span>, <span class="is">"eth"</span>, <span class="is">"base"</span>]),
  address: z.string().regex(<span class="is">/^0x[a-fA-F0-9]{40}$/</span>)
}, <span class="ik">async</span> ({chain, address}) =&gt; {
  <span class="ik">const</span> bal = <span class="ik">await</span> rpc.getBalance(chain, address);
  <span class="ik">return</span> { content: [{ type:<span class="is">"text"</span>, text:<span class="is">'Balance: ' + bal + ' ETH'</span> }] };
});</code></pre>
  <div class="warn-box" style="margin-top:12px"><b>实战经验：</b> 记忆比规划更重要。Agent 出错绝大多数是因为"忘了关键约束"，而不是"想错了"。用组织知识库持久化用户偏好与项目约定，能把 Agent 稳定性从 70% 拉到 95%。</div>
`},

  <div class="quote" style="margin-top:14px"><p>关键洞察：单点产品天花板在 $1-10B，平台公司天花板在 $100B+。我们要做的不是"做一个好产品"，而是"做产品的产品"。</p></div>
`},

{type:'content', html:`
  <h2>为什么不局限单赛道 · 跨赛道协同</h2>
  <p class="lead">单一赛道容易被巨头碾过，跨赛道共享记忆与身份才能形成壁垒。</p>
  <div class="grid g2" style="margin-top:18px;gap:14px">
    <div class="card">
      <h3 style="margin-top:0">❌ 单赛道困境</h3>
      <p style="font-size:13px;line-height:1.8;margin:0">
        只做 Web3 → 币圈熊市营收腰斩<br/>
        只做企业服务 → 微软/Google 一旦发力就碾压<br/>
        只做消费 → 用户留存难、获客成本飙升<br/>
        只做金融 → 合规成本高、牌照壁垒厚但增速慢
      </p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">✅ 跨赛道协同</h3>
      <p style="font-size:13px;line-height:1.8;margin:0">
        同一用户身份：商务人士白天用客服 Agent，晚上用投资 Agent<br/>
        同一记忆：知道你是 CFO，所有产品都懂你的偏好<br/>
        同一技术栈：MCP 工具 / 记忆 / 规划一次投入，多赛道复用<br/>
        同一营收池：B 端 + C 端 + 平台抽佣，风险对冲
      </p>
    </div>
  </div>
  <h3 style="margin-top:18px">具体协同案例</h3>
  <ul>
    <li><b>身份打通</b>：你用我们的客服 Agent 处理工单 → 我们懂你公司业务 → 营销 Agent 自动帮你写文案 → 投顾 Agent 帮你管营收</li>
    <li><b>记忆打通</b>：医疗 Agent 知道你有高血压 → 健康提醒 → 食谱推荐 → 运动计划 → 保险 Agent 给你定制方案</li>
    <li><b>数据打通</b>：Web3 钱包助手知道你风险偏好 → 跨赛道给你推荐合适的产品 → 投顾 Agent 直接服务</li>
  </ul>
  <div class="warn-box" style="margin-top:14px"><b>平台公司的本质：</b>不是"做了多少产品"，而是"用户在我们的生态里能完成多少事"。用户离开 = 失去全部记忆与身份 —— 这才是真壁垒。</div>
`},

{type:'content', html:`
  <h2>竞争格局 · 巨头 vs 创业公司的差异化</h2>
  <p class="lead">不和巨头正面打 —— 找到它们看不见或不愿做的位置。</p>
  <table style="margin-top:14px">
    <tr><th>玩家</th><th>优势</th><th>劣势</th><th>我们的差异化</th></tr>
    <tr><td><b>OpenAI / Anthropic</b></td><td>模型能力天花板<br/>ChatGPT 用户基数</td><td>不做垂直深耕<br/>不碰金融/Web3 合规</td><td>用它们的模型做底座<br/>做它们不愿做的垂直</td></tr>
    <tr><td><b>Google / Microsoft</b></td><td>办公场景绑定<br/>云 + AI 一体化</td><td>创新慢、内部博弈<br/>不做 Web3</td><td>跨平台中立<br/>AI 原生而非改造</td></tr>

    <tr><td><b>Cursor / Devin / Perplexity</b></td><td>单点做透<br/>先发品牌</td><td>只覆盖单场景<br/>无跨赛道能力</td><td>多场景平台<br/>共享身份与记忆</td></tr>

`},

        + '<h1>' + s.title + '</h1>'
        + '<div class="bar"></div>'
        + '<div class="desc">' + (s.desc || '') + '</div></div>';
    } else {
      el.innerHTML = '<div class="slide-inner">' + s.html + '</div>';
    }
    deck.appendChild(el);
  });
  buildToc();
  update();
}

function buildToc(){
  tocList.innerHTML = '';
  slides.forEach((s, i) => {
    if(s.type === 'cover') return;   // 封面不进大纲
    const li = document.createElement('li');
    if(s.type === 'section'){
      li.className = 'section';
      li.textContent = s.title;
    } else {
      const h = (s.html.match(/<h2[^>]*>(.*?)<\/h2>/) || [,'(无标题)'])[1].replace(/<[^>]+>/g,'');
      li.textContent = h;
      li.onclick = () => { go(i); toggleToc(); };
    }
    tocList.appendChild(li);
  });
}

function update(){
  document.querySelectorAll('.slide').forEach((el, i) => {
    el.classList.toggle('active', i === cur);
  });
  progress.style.width = ((cur + 1) / slides.length * 100) + '%';
  pageno.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
}

function go(i){ cur = Math.max(0, Math.min(slides.length - 1, i)); update(); }
function next(){ if(cur < slides.length - 1) cur++; update(); }
function prev(){ if(cur > 0) cur--; update(); }
function toggleToc(){ document.getElementById('toc').classList.toggle('open'); }
function fullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
  else if(e.key === 'Home'){ go(0); }
  else if(e.key === 'End'){ go(slides.length - 1); }
  else if(e.key.toLowerCase() === 't'){ toggleToc(); }
  else if(e.key.toLowerCase() === 'f'){ fullscreen(); }
  else if(e.key === 'Escape'){ document.getElementById('toc').classList.remove('open'); }
});

document.addEventListener('click', e => {
  if(e.target.closest('.controls') || e.target.closest('.toc')) return;
  if(e.clientX > window.innerWidth / 2) next(); else prev();
});

render();

/* === 鼠标视差：4 个光球各自缓动跟随鼠标（景深效果）=== */
const ambientOrbs = document.querySelectorAll('.ambient .orb');
let ambTX = [], ambTY = [], ambCX = [], ambCY = [];
const strengths = [80, 60, 45, 35];  // 不同光球不同视差强度
const eases = [0.05, 0.04, 0.03, 0.025];  // 不同缓动速度

ambientOrbs.forEach(() => { ambTX.push(0); ambTY.push(0); ambCX.push(0); ambCY.push(0); });

window.addEventListener('mousemove', e => {
  const nx = (e.clientX / window.innerWidth - 0.5) * 2;
  const ny = (e.clientY / window.innerHeight - 0.5) * 2;
  ambientOrbs.forEach((_, i) => {
    ambTX[i] = nx;
    ambTY[i] = ny;
  });
});

function tickAmbient(){
  ambientOrbs.forEach((orb, i) => {
    ambCX[i] += (ambTX[i] - ambCX[i]) * eases[i];
    ambCY[i] += (ambTY[i] - ambCY[i]) * eases[i];
    orb.style.setProperty('--mx', (ambCX[i] * strengths[i]) + 'px');
    orb.style.setProperty('--my', (ambCY[i] * strengths[i]) + 'px');
  });
  requestAnimationFrame(tickAmbient);
}
tickAmbient();

/* === 封面大机器人 + 全局小机器人：鼠标跟随转头 === */
const robotHead = document.querySelector('.robot-head');
const miniHead  = document.querySelector('.mini-head');
const miniRobot = document.getElementById('miniRobot');
let robTX = 0, robTY = 0, robCX = 0, robCY = 0;

window.addEventListener('mousemove', e => {
  robTX = (e.clientX / window.innerWidth - 0.5) * 2;
  robTY = (e.clientY / window.innerHeight - 0.5) * 2;
});

function tickRobot(){
  robCX += (robTX - robCX) * 0.06;
  robCY += (robTY - robCY) * 0.06;
  // 封面大机器人
  if(robotHead){
    const rotY = robCX * 25;
    const rotX = -15 + robCY * 15;
    robotHead.style.animation = 'none';
    robotHead.style.transform = 'translate(-50%,-50%) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
  }
  // 全局小机器人（转头幅度略小）
  if(miniHead){
    const rotY = robCX * 20;
    const rotX = -10 + robCY * 12;
    miniHead.style.animation = 'none';
    miniHead.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
  }
  requestAnimationFrame(tickRobot);
}
tickRobot();

// 封面页时隐藏小机器人（封面已有大机器人），其他页显示
function updateMiniRobot(){
  if(!miniRobot) return;
  const slide = document.querySelector('.slide.active');
  const isCover = slide && slide.classList.contains('cover');
  miniRobot.style.opacity = isCover ? '0' : '1';
  miniRobot.style.pointerEvents = isCover ? 'none' : 'auto';
  miniRobot.style.transition = 'opacity .4s ease';
}
// 在 update() 里也调用
const _origUpdate = update;
window.update = function(){
  _origUpdate();
  updateMiniRobot();
};
updateMiniRobot();
</script>
