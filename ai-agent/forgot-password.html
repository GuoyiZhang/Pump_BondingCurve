<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 · AI Agent 策略广场</title>
  <meta name="description" content="输入注册邮箱，我们发送重置链接给你。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 环境光球 -->
<div class="ambient">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
</div>

<!-- 导航 -->
<nav class="nav">
  <a href="index.html" class="nav-brand">
    <div class="mini-robot"><div class="mini-head"><div class="mini-face"><div class="mini-eye left"></div><div class="mini-eye right"></div><div class="mini-mouth"></div></div><div class="mini-antenna"></div></div></div>
    <span class="logo-text">AI Agent 策略广场</span>
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">首页</a>
    <a href="features.html" class="nav-link">功能</a>
    <a href="creators.html" class="nav-link">创作者</a>
    <a href="pricing.html" class="nav-link">定价</a>
    <a href="docs.html" class="nav-link">文档</a>
  </div>
  <div class="nav-cta">
    <a href="login.html" class="btn btn-ghost btn-sm">登录</a>
    <a href="login.html" class="btn btn-primary btn-sm">免费注册</a>
  </div>
</nav>

<!-- 忘记密码卡片 -->
<div class="auth-layout">
  <div class="auth-card narrow">

    <!-- 状态 1：输入邮箱 -->
    <div id="state-email" class="auth-state">
      <div class="auth-header">
        <div class="auth-icon">🔑</div>
        <h1>忘记密码</h1>
        <p>输入注册邮箱，我们发送重置链接给你</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email-input">邮箱<span class="required">*</span></label>
          <input
            type="email"
            id="email-input"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email">
          <div class="field-error" id="email-error" style="display:none">⚠ 邮箱格式不正确</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">发送重置链接</button>
      </form>

      <div class="auth-switch">
        想起来了？<a href="login.html">返回登录 →</a>
      </div>
    </div>

    <!-- 状态 2：发送成功提示 -->
    <div id="state-sent" class="auth-state" style="display:none">
      <div class="auth-header">
        <div class="auth-icon" style="width:80px;height:80px;font-size:40px;background:linear-gradient(135deg,rgba(107,140,255,0.25),rgba(61,217,235,0.18));border:1px solid rgba(107,140,255,0.5);box-shadow:0 0 32px rgba(107,140,255,0.35)">📧</div>
        <h1>检查你的邮箱</h1>
        <p id="sent-desc">我们已向 <strong id="sent-email" style="color:var(--fg)">you@example.com</strong> 发送了重置链接，请在 30 分钟内查收并点击链接重置密码</p>
      </div>

      <div class="form-success">
        ✓ 邮件已发送，没收到？检查垃圾邮件文件夹
      </div>

      <button type="button" id="resend-btn" class="btn btn-ghost btn-block">重新发送</button>
      <a href="login.html" class="btn btn-primary btn-block">返回登录</a>
    </div>

  </div>
</div>

<script src="script.js"></script>
<script>
(function(){
  var stateEmail = document.getElementById('state-email');
  var stateSent  = document.getElementById('state-sent');
  var form       = document.getElementById('forgot-form');
  var emailInput = document.getElementById('email-input');
  var emailError = document.getElementById('email-error');
  var sentEmail  = document.getElementById('sent-email');
  var resendBtn  = document.getElementById('resend-btn');

  // 邮箱格式校验
  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  // 显示字段错误
  function showFieldError(msg){
    emailError.textContent = '⚠ ' + (msg || '邮箱格式不正确');
    emailError.style.display = 'flex';
  }
  function clearFieldError(){
    emailError.style.display = 'none';
  }

  // 输入时清除错误
  emailInput.addEventListener('input', clearFieldError);

  // 切换到状态 2
  function switchToSent(email){
    sentEmail.textContent = email;
    stateEmail.style.display = 'none';
    stateSent.style.display = 'block';
  }

  // 点击"发送重置链接"
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = emailInput.value.trim();
    if (!email) {
      showFieldError('请输入邮箱');
      return;
    }
    if (!isValidEmail(email)) {
      showFieldError('邮箱格式不正确');
      return;
    }
    clearFieldError();
    switchToSent(email);
  });

  // 点击"重新发送"
  resendBtn.addEventListener('click', function(){
    var tip = document.getElementById('resend-tip');
    if (tip) tip.remove();
    tip = document.createElement('div');
    tip.id = 'resend-tip';
    tip.className = 'form-success';
    tip.style.marginTop = '12px';
    tip.textContent = '✓ 重置邮件已重新发送，请查收';
    resendBtn.parentNode.insertBefore(tip, resendBtn.nextSibling);
    // 2.5s 后自动消失
    setTimeout(function(){
      if (tip && tip.parentNode) tip.parentNode.removeChild(tip);
    }, 2500);
  });
})();
</script>
</body>
</html>
